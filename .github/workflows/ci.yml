name: Package and CPU workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/constraints-py311.txt
      - name: Install CPU runtime and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build twine pytest
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install -c requirements/constraints-py311.txt dist/*.whl
          python -m pip check
      - name: Test helpers
        run: python -m pytest tests -q
      - name: Test installed CLI and CPU tutorial
        run: |
          cd /tmp
          exct --help
          exct download list
          python "$GITHUB_WORKSPACE/examples/cpu_quickstart.py" --output /tmp/exct-cpu-example --explain
