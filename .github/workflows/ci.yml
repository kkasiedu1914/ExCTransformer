name: Package and CPU workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/constraints-py311.txt
      - name: Install CPU runtime and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build twine pytest
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install -c requirements/constraints-py311.txt dist/*.whl
          python -m pip check
      - name: Test helpers
        run: python -m pytest tests -q
      - name: Test installed CLI and CPU tutorial
        run: |
          cd /tmp
          exct --help
          exct download list
          python "$GITHUB_WORKSPACE/examples/cpu_quickstart.py" --output /tmp/exct-cpu-example --explain
